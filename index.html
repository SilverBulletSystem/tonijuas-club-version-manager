<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tonijuas Club · Documentos legales</title>
<meta name="description" content="Documentos legales de Tonijuas Club.">
<link rel="canonical" href="https://silverbulletsystem.github.io/tonijuas-club-version-manager/">
<style>
:root{--bg:#faf8f4;--surface:#ffffff;--text:#1d1b18;--muted:#5f5a52;--line:#e4dfd6;
--accent:#1f6b4a;--accent-soft:#e6f2ec;--notice:#fff6e0;--notice-line:#e9c46a}
@media (prefers-color-scheme: dark){:root{--bg:#141311;--surface:#1c1a17;--text:#ece8e1;
--muted:#a8a197;--line:#34302a;--accent:#6fcf9f;--accent-soft:#1d2b24;--notice:#2a2416;--notice-line:#8a7232}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:32px 16px 64px}
header.top{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:8px}
.brand{font-weight:700;letter-spacing:.02em;color:var(--accent);font-size:.9rem;text-transform:uppercase}
h1{font-size:1.9rem;line-height:1.25;margin:.3em 0 .4em}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.pill{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:600}
.pill.plain{background:transparent;color:var(--muted);border:1px solid var(--line)}
nav.toc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:24px 0}
nav.toc strong{display:block;margin-bottom:6px}
nav.toc ol{margin:0;padding-left:1.3em;columns:2;column-gap:28px}
nav.toc li{break-inside:avoid;font-size:.92rem;margin:0 0 .3em}
@media (max-width:560px){nav.toc ol{columns:1}h1{font-size:1.55rem}}
h2{font-size:1.25rem;margin:2em 0 .5em;padding-top:.4em;scroll-margin-top:16px}
p,li{overflow-wrap:anywhere}
ul{padding-left:1.3em}
li{margin:.25em 0}
a{color:var(--accent)}
.notice{background:var(--notice);border-left:4px solid var(--notice-line);padding:10px 14px;border-radius:6px}
.table-wrap{overflow-x:auto;margin:1em 0}
table{border-collapse:collapse;width:100%;background:var(--surface);font-size:.95rem}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
thead th{background:var(--accent-soft)}
table.kv th{width:40%;font-weight:600;background:var(--accent-soft)}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
.versions td:first-child{white-space:nowrap}
@media print{nav.toc{display:none}body{background:#fff;color:#000}a{color:#000}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div class="brand">Tonijuas Club</div>
<h1>Documentos legales</h1>
</header>
<ul>
<li><a href="terminos/">Términos y Condiciones</a> · versión 1.0.0, vigente desde el 23 de octubre de 2026</li>
</ul>
<footer>Tonijuas Club SpA · RUT 78.539.937-4 · <a href="mailto:tonijuasclub@gmail.com">tonijuasclub@gmail.com</a></footer>
</div>
</body>
</html>
